experiment: "E4_hybrid"
method: "Prompted Judge Findings + Code Features into Logistic Regression"
judge:
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  temperature: 0.0
  json_schema:
    supported_claims: int
    unsupported_claims: int
    missing_info: list
    assumed_facts: int
    judge_confidence: float
validation:
  target: "missing_info flagging unknown (n_removed > 0)"
  min_recall_threshold: 0.70
feature_sets:
  e4a: "Judge findings only"
  e4b: "Code features only (equals E3)"
  e4c: "Hybrid: Judge findings + Code features"
