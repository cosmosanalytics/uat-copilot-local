<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS AI Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#F7F8FA; --ink:#15212E; --muted:#5A6878; --line:#D5DBE2;
  --accent:#0F6E8C; --accent-bg:#E4F2F6; --ok:#1E7A4C; --ok-bg:#E3F3EA; --err:#B42F24; --err-bg:#FBE9E7; --warn:#9A6200; --warn-bg:#FDF2DD;
  --f:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top b{font-weight:700;letter-spacing:.01em}
.top .sp{flex:1}
.top .region{font-size:13px;opacity:.8}
.top button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 48px)}
.shell>*{min-width:0}
.top .tag{color:#9fb0c0;font-size:13px}
@media (max-width:600px){.top .tag,.top .region{display:none}}
@media (min-width:900px){.shell{grid-template-columns:230px 1fr}}
nav.side{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.side .list{display:flex;overflow-x:auto;gap:2px;padding:0 8px;scrollbar-width:none}
nav.side .list::-webkit-scrollbar{display:none}
nav.side .grp{display:none}
nav.side a{display:flex;align-items:center;gap:8px;padding:11px 10px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500;font-size:14px}
nav.side a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.side .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
nav.side .dot.done{background:var(--ok)}
@media (min-width:900px){
  nav.side{border-bottom:0;border-right:1px solid var(--line);height:100%;position:static}
  nav.side .list{display:block;padding:12px 8px;position:sticky;top:0}
  nav.side .grp{display:block;font-size:12px;color:var(--muted);padding:14px 10px 4px}
  nav.side a{border-bottom:0;border-left:3px solid transparent;border-radius:0 6px 6px 0}
  nav.side a[aria-current="page"]{border-left-color:var(--accent);background:var(--accent-bg)}
}
main{padding:20px 16px 60px;max-width:960px;width:100%}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.intro{color:var(--muted);margin:6px 0 18px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.bd{padding:14px 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;font-size:14px;font-weight:500;min-width:0}
.field small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:80px}
textarea.code{font:13px/1.5 var(--mono);background:var(--sunk);min-height:260px;white-space:pre;overflow:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:4px 10px;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-err{background:var(--err-bg);color:var(--err)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-gray{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
pre.out{margin:0;font:13px/1.5 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.alert{border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:12px;border:1px solid}
.alert.err{background:var(--err-bg);border-color:#EDC3BE;color:var(--err)}
.alert.ok{background:var(--ok-bg);border-color:#BFE0CC;color:var(--ok)}
.alert.info{background:var(--accent-bg);border-color:#BFDCE6;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.steps .phase{font-size:12px;color:var(--muted)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
@media (min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metrics div{background:var(--surface);padding:12px 14px}
.metrics b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metrics span{font-size:13px;color:var(--muted)}
.log{font:12.5px/1.55 var(--mono);background:#0F1923;color:#D6E2EC;border-radius:6px;padding:12px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .e{color:#FF9C8F} .log .t{color:#7FA3BF}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:420px;overflow:auto;padding:4px 0 10px}
.msg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:var(--sunk);border:1px solid var(--line)}
.msg.x{align-self:flex-start;background:var(--err-bg);color:var(--err);border:1px solid #EDC3BE}
.tokens{font-size:12px;color:var(--muted);margin-top:6px}
.chunk{border-left:3px solid var(--accent);background:var(--sunk);padding:8px 10px;margin:6px 0;font-size:13px}
.hide{display:none!important}
</style>

<script>
// ===== Semantic knowledge graph core (no DOM) =====
const SKG = (() => {
  const STOP = new Set("a an the and or but if of to in on at by for with from as is are was were be been being it its this that these those their there they them he she his her you your we our i me my can often many most much more some any all each every than then so such into out up down over under about after before during usually also use uses used using make makes like one two well may might will would should could must not no do does did have has had just very before per".split(" "));
  const stem = (w) => w.length > 4 ? w.replace(/(ies)$/, "y").replace(/(ing|edly|ed|es|s)$/, "") : w;
  const words = (s) => (s.toLowerCase().match(/[a-z][a-z0-9-]*/g) || []).filter((w) => !STOP.has(w) && w.length > 2).map(stem);
  function splitSentences(text) {
    return text.replace(/\s+/g, " ").split(/(?<=[.!?])\s+(?=[A-Z0-9"'])/).map((s) => s.trim()).filter((s) => s.length > 12).slice(0, 80);
  }
  // TF-IDF over words + concept tags: a lexical stand-in for Titan embeddings
  function embed(sentences, tags = []) {
    const docs = sentences.map((s, i) => [...words(s), ...(tags[i] || []).flatMap((t) => words(t)).flatMap((w) => [w, w])]);
    const df = {};
    docs.forEach((d) => new Set(d).forEach((w) => (df[w] = (df[w] || 0) + 1)));
    const N = docs.length, idf = (w) => Math.log((N + 1) / ((df[w] || 0) + 1)) + 1;
    const vec = (d) => { const tf = {}; d.forEach((w) => (tf[w] = (tf[w] || 0) + 1)); const v = {}; let n = 0;
      for (const [w, c] of Object.entries(tf)) { v[w] = c * idf(w); n += v[w] ** 2; } n = Math.sqrt(n) || 1; for (const w in v) v[w] /= n; return v; };
    return { vecs: docs.map(vec), query: (s) => vec(words(s)) };
  }
  const cos = (a, b) => { let s = 0; for (const w in a) if (b[w]) s += a[w] * b[w]; return s; };
  function similarities(vecs) {
    const out = [];
    for (let i = 0; i < vecs.length; i++) for (let j = i + 1; j < vecs.length; j++) { const w = cos(vecs[i], vecs[j]); if (w > 0.05) out.push({ a: i, b: j, w: +w.toFixed(3) }); }
    return out;
  }
  // Louvain community detection (weighted, multi-level)
  function louvain(n, edges) {
    let comm = Array.from({ length: n }, (_, i) => i);
    let nodes = n, E = edges.map((e) => ({ a: e.a, b: e.b, w: e.w }));
    let membership = comm.slice();
    for (let level = 0; level < 10; level++) {
      const adj = Array.from({ length: nodes }, () => new Map()); let m2 = 0;
      E.forEach(({ a, b, w }) => { adj[a].set(b, (adj[a].get(b) || 0) + w); adj[b].set(a, (adj[b].get(a) || 0) + w); m2 += 2 * w; });
      if (!m2) break;
      const k = adj.map((m) => [...m.values()].reduce((x, y) => x + y, 0));
      const c = Array.from({ length: nodes }, (_, i) => i), tot = k.slice();
      let moved = true, any = false, guard = 0;
      while (moved && guard++ < 50) {
        moved = false;
        for (let i = 0; i < nodes; i++) {
          const ci = c[i], links = new Map();
          adj[i].forEach((w, j) => { if (j !== i) links.set(c[j], (links.get(c[j]) || 0) + w); });
          tot[ci] -= k[i];
          let best = ci, gain = (links.get(ci) || 0) - (tot[ci] * k[i]) / m2;
          links.forEach((w, cj) => { const g = w - (tot[cj] * k[i]) / m2; if (g > gain + 1e-12) { gain = g; best = cj; } });
          c[i] = best; tot[best] += k[i];
          if (best !== ci) { moved = true; any = true; }
        }
      }
      if (!any) break;
      const ids = {}; let nid = 0; c.forEach((x) => { if (!(x in ids)) ids[x] = nid++; });
      membership = membership.map((x) => ids[c[x]]);
      const agg = new Map();
      E.forEach(({ a, b, w }) => { const ca = ids[c[a]], cb = ids[c[b]]; const key = ca < cb ? `${ca}|${cb}` : `${cb}|${ca}`; agg.set(key, (agg.get(key) || 0) + w); });
      E = [...agg].map(([key, w]) => { const [a, b] = key.split("|").map(Number); return { a, b, w }; }).filter((e) => e.a !== e.b || true);
      nodes = nid;
      if (nid === 1) break;
    }
    // renumber by size
    const counts = {}; membership.forEach((x) => (counts[x] = (counts[x] || 0) + 1));
    const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]); const map = {}; order.forEach((x, i) => (map[x] = i));
    return membership.map((x) => map[x]);
  }
  function layout(n, edges, comm, W = 600, H = 420) {
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const p = Array.from({ length: n }, (_, i) => { const a = (comm[i] || 0) * 1.3 + rnd() * 0.8, r = 60 + rnd() * 80; return { x: W / 2 + Math.cos(a) * r * 1.3, y: H / 2 + Math.sin(a) * r }; });
    const k = Math.sqrt((W * H) / Math.max(n, 1)) * 0.5;
    let temp = W / 8;
    for (let it = 0; it < 250; it++) {
      const d = p.map(() => ({ x: 0, y: 0 }));
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        const dx = p[i].x - p[j].x, dy = p[i].y - p[j].y, dist = Math.hypot(dx, dy) || 0.1, f = (k * k) / dist;
        d[i].x += (dx / dist) * f; d[i].y += (dy / dist) * f; d[j].x -= (dx / dist) * f; d[j].y -= (dy / dist) * f;
      }
      edges.forEach(({ a, b, w }) => { const dx = p[a].x - p[b].x, dy = p[a].y - p[b].y, dist = Math.hypot(dx, dy) || 0.1, f = ((dist * dist) / k) * (0.5 + w);
        d[a].x -= (dx / dist) * f; d[a].y -= (dy / dist) * f; d[b].x += (dx / dist) * f; d[b].y += (dy / dist) * f; });
      p.forEach((q, i) => { const gx = W / 2 - q.x, gy = H / 2 - q.y; d[i].x += gx * k * 0.012; d[i].y += gy * k * 0.02;
        const m = Math.hypot(d[i].x, d[i].y) || 1, s = Math.min(m, temp);
        q.x = Math.min(W - 18, Math.max(18, q.x + (d[i].x / m) * s)); q.y = Math.min(H - 18, Math.max(18, q.y + (d[i].y / m) * s)); });
      temp = Math.max(1, temp * 0.975);
    }
    const xs = p.map((q) => q.x), ys = p.map((q) => q.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sx = (W - 60) / Math.max(x1 - x0, 1), sy = (H - 60) / Math.max(y1 - y0, 1), sc = Math.min(sx, sy, 1.6);
    const ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
    return p.map(({ x, y }) => ({ x: +(ox + (x - x0) * sc).toFixed(1), y: +(oy + (y - y0) * sc).toFixed(1) }));
  }
  return { splitSentences, embed, similarities, louvain, layout, cos, words };
})();


</script>
<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toISOString().replace("T", " ").slice(0, 19);
const rid = () => Math.random().toString(16).slice(2, 10) + "-" + Math.random().toString(16).slice(2, 6);
const tok = (s) => Math.max(1, Math.round(String(s || "").length / 4));

// ---------- simulated catalog (illustrative prices per 1K tokens, not real AWS pricing) ----------
const MODELS = [
  { id: "anthropic.claude-sonnet", name: "Claude Sonnet", provider: "Anthropic", tier: "default", inP: 0.003, outP: 0.015 },
  { id: "anthropic.claude-haiku", name: "Claude Haiku", provider: "Anthropic", tier: "quick", inP: 0.001, outP: 0.005 },
  { id: "amazon.nova-pro", name: "Nova Pro", provider: "Amazon", tier: "default", inP: 0.0008, outP: 0.0032 },
  { id: "amazon.nova-micro", name: "Nova Micro", provider: "Amazon", tier: "quick", inP: 0.000035, outP: 0.00014 },
];
const modelById = (id) => MODELS.find((m) => m.id === id);
const SAMPLE_DOCS = [
  { key: "faq.md", text: "# Acme Cloud Store FAQ\n\nShipping: Standard shipping takes 3 to 5 business days. Express shipping takes 1 business day and costs $15.\n\nReturns: Items can be returned within 30 days of delivery for a full refund. Opened software cannot be returned.\n\nSupport hours: Our support team is available Monday to Friday, 9am to 6pm Eastern time." },
  { key: "warranty.md", text: "# Warranty policy\n\nAll hardware comes with a 1-year limited warranty covering manufacturing defects.\n\nAccidental damage is not covered unless you bought the Care Plus add-on, which costs $49 per year.\n\nTo make a claim, email warranty@acme.example with your order number and a photo of the problem." },
];
const LAMBDA_CODE = `import json, os, boto3
from strands import Agent, tool

MODEL_ID = os.environ["MODEL_ID"]
KB_ID = os.environ.get("KB_ID")          # optional: enables RAG

@tool
def retrieve_context(query: str) -> str:
    """Search the knowledge base for passages relevant to the query.
    Call this when the question needs facts from company documents."""
    hits = boto3.client("bedrock-agent-runtime").retrieve(
        knowledgeBaseId=KB_ID,
        retrievalQuery={"text": query},
    )["retrievalResults"]
    return "\\n\\n".join(h["content"]["text"] for h in hits)

# The agent, not this code, decides whether and when to call retrieve_context.
agent = Agent(model=MODEL_ID, tools=[retrieve_context] if KB_ID else [])

def handler(event, context):
    body = json.loads(event.get("body") or "{}")
    question = body.get("question", "")
    result = agent(question)
    return {"statusCode": 200, "body": json.dumps({"answer": str(result)})}
`;

// ---------- state ----------
const fresh = () => ({
  access: {}, buckets: [], kb: null, fn: null, api: null, sfn: null, executions: {},
  logs: [], metrics: { modelCalls: 0, inTok: 0, outTok: 0, fnInv: 0, fnErr: 0, apiReq: 0, api5xx: 0, cost: 0 },
  did: { playground: false, clientCall: false, viewedLogs: false }, graph: null,
});
let S;
try { S = JSON.parse(localStorage.getItem("awssim") || "null") || fresh(); } catch { S = fresh(); }
const save = () => { try { localStorage.setItem("awssim", JSON.stringify(S)); } catch {} };
let view = (() => { try { return localStorage.getItem("awssim:view") || "home"; } catch { return "home"; } })();
// ---------- local models: WebLLM on WebGPU (stand-ins for Bedrock models) ----------
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
const LOCAL = {
  embed: [["snowflake-arctic-embed-s-q0f32-MLC-b4", "Arctic Embed S", "Smaller and faster"], ["snowflake-arctic-embed-m-q0f32-MLC-b4", "Arctic Embed M", "Larger, more accurate"]],
  chat: [["Qwen2.5-1.5B-Instruct-q4f16_1-MLC", "Qwen2.5 1.5B", "About 1 GB download"], ["Qwen2.5-3B-Instruct-q4f16_1-MLC", "Qwen2.5 3B", "About 2 GB, better reasoning"]],
};
const ARCTIC_QUERY = "Represent this sentence for searching relevant passages: ";
const LLM = { engine: null, chatId: null, embId: null, status: "idle", progress: 0, text: "", err: "",
  webgpu: typeof navigator !== "undefined" && !!navigator.gpu,
  pick: (() => { try { return JSON.parse(localStorage.getItem("awssim:models")) || null; } catch { return null; } })() || { chat: LOCAL.chat[0][0], embed: LOCAL.embed[0][0] } };
const llmReady = () => LLM.status === "ready";
const shortName = (id) => [...LOCAL.chat, ...LOCAL.embed].find((m) => m[0] === id)?.[1] || id;
function chipText() { return llmReady() ? `Local: ${shortName(LLM.chatId)}` : LLM.status === "loading" ? `Loading ${Math.round(LLM.progress * 100)}%` : LLM.webgpu ? "Load models" : "No WebGPU"; }
function paintProgress() {
  document.querySelectorAll("[data-llmprog]").forEach((el) => { const p = el.querySelector("progress"); if (p) p.value = LLM.progress; const t = el.querySelector(".ptext"); if (t) t.textContent = LLM.text; });
  const c = document.getElementById("llmchip"); if (c) c.textContent = chipText();
}
async function loadModels() {
  if (!LLM.webgpu || LLM.status === "loading") return;
  LLM.status = "loading"; LLM.err = ""; LLM.progress = 0; LLM.text = "Starting…"; render();
  try {
    const webllm = await import(WEBLLM_URL);
    if (LLM.engine) { try { await LLM.engine.unload(); } catch {} LLM.engine = null; }
    LLM.engine = await webllm.CreateMLCEngine([LLM.pick.chat, LLM.pick.embed], { initProgressCallback: (r) => { LLM.progress = r.progress; LLM.text = r.text; paintProgress(); } });
    LLM.chatId = LLM.pick.chat; LLM.embId = LLM.pick.embed; LLM.status = "ready";
    try { localStorage.setItem("awssim:models", JSON.stringify(LLM.pick)); } catch {}
  } catch (e) {

    LLM.err = /device|memory|OOM|lost/i.test(m) ? `The GPU ran out of memory (${m.slice(0, 120)}). Pick the smaller models and try again.` : `Loading failed: ${m.slice(0, 200)}`;

// WebLLM runs one request at a time, so calls go through a queue
let llmQueue = Promise.resolve();
const enqueue = (fn) => { const p = llmQueue.then(fn, fn); llmQueue = p.catch(() => {}); return p; };
function llmChat(prompt, { json = false, maxTokens = 400, temperature = 0.3 } = {}) {
  return enqueue(async () => {
    if (!llmReady()) throw awsError("ModelNotLoaded", "Load the local models first on the Local models page.");
    // Constrained JSON decoding (response_format: json_object) crashes on some device/model
    // combinations ("grammar matcher" errors), so ask for JSON in plain language instead and
    // parse it ourselves (see parseJSON's regex fallback) — slower to fail, but never crashes.
    const content = json ? `${prompt}\n\nRespond with ONLY a single valid JSON object, no other text before or after it.` : prompt;
    const req = { model: LLM.chatId, messages: [{ role: "user", content }], temperature, max_tokens: maxTokens };
    const r = await LLM.engine.chat.completions.create(req);
    const text = (r.choices?.[0]?.message?.content || "").trim();
    return { text, inT: r.usage?.prompt_tokens ?? tok(prompt), outT: r.usage?.completion_tokens ?? tok(text) };
  });
}
function parseJSON(t) {
  try { return JSON.parse(t); } catch {}
  const m = String(t).match(/\{[\s\S]*\}/); if (m) { try { return JSON.parse(m[0]); } catch {} }
  throw awsError("InvalidJSON", "The local model didn't return valid JSON. Try again, or switch to the 3B model.");
}
function llmEmbed(texts) {
  return enqueue(async () => {
    if (!llmReady()) throw awsError("ModelNotLoaded", "Load the local models first on the Local models page.");
    const out = [];
    for (let i = 0; i < texts.length; i += 4) {
      const r = await LLM.engine.embeddings.create({ input: texts.slice(i, i + 4), model: LLM.embId });
      r.data.forEach((d) => { const v = d.embedding, n = Math.hypot(...v) || 1; out.push(v.map((x) => +(x / n).toFixed(5))); });
    }
    return out;
  });
}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

// ---------- simulated Bedrock model call (answered by the local WebLLM model when loaded) ----------
async function callModel(modelId, prompt, opts = {}) {
  const m = modelById(modelId);
  let text;
  if (llmReady()) {
    const r = await llmChat(`You are answering as the foundation model "${m.name}" (${m.provider}) inside a simulated AWS Bedrock sandbox. Answer the user's prompt directly and concisely, in under ${opts.maxWords || 150} words. Do not mention the simulation.\n\n${prompt}`, { maxTokens: 400 });
    text = r.text;
  } else {
    await new Promise((r) => setTimeout(r, 400));
    text = `[Placeholder ${m.name} response] No local model is loaded, so this is a stand-in. Load models on the Local models page for real answers. Your prompt was ${tok(prompt)} tokens` +
      (prompt.includes("Context:") ? " and included retrieved context from your knowledge base." : ".");
  }
  const inT = tok(prompt), outT = tok(text), cost = (inT * m.inP + outT * m.outP) / 1000;
  S.metrics.modelCalls++; S.metrics.inTok += inT; S.metrics.outTok += outT; S.metrics.cost += cost;
  return { text, inT, outT, cost };
}
function awsError(code, message) { const e = new Error(message); e.code = code; return e; }

// ---------- knowledge base retrieval (keyword scoring stand-in for vector search) ----------
function chunkDocs(objs) {
  const out = [];
  for (const o of objs) o.text.split(/\n\s*\n/).map((p) => p.trim()).filter((p) => p && !/^#+\s*[^\n]*$/.test(p)).forEach((p, i) => out.push({ source: o.key, n: i + 1, text: p }));
  return out;
}
function retrieve(q, k = 3) {
  const stop = new Set("the a an of to and or is are what how do does can i my for in on with be it you your".split(" "));
  const terms = (q.toLowerCase().match(/[a-z0-9$]+/g) || []).filter((t) => !stop.has(t) && t.length > 1);
  return S.kb.chunks.map((c) => { const h = c.text.toLowerCase(); const score = terms.reduce((a, t) => a + (h.includes(t) ? 1 : 0), 0); return { ...c, score: +(score / Math.max(terms.length, 1)).toFixed(2) }; })
    .filter((c) => c.score > 0).sort((a, b) => b.score - a.score).slice(0, k);
}

// ---------- Lambda runtime simulation ----------
function log(group, line, kind = "") { S.logs.push({ t: now(), group, line, kind }); if (S.logs.length > 400) S.logs.shift(); }
async function invokeFunction(event, cfgOverride) {
  const fn = S.fn, g = `/aws/lambda/${fn.name}`, reqId = rid(), t0 = performance.now();
  const cfg = cfgOverride || (fn.live ? { env: fn.env, perms: fn.perms } : null);
  S.metrics.fnInv++;
  log(g, `START RequestId: ${reqId} Version: $LATEST`);
  try {
    if (!fn.live || !cfg) throw awsError("ResourceNotReady", "Function has no deployed version. Click Deploy.");
    let body = {};
    try { body = JSON.parse(event.body || "{}"); } catch { throw awsError("JSONDecodeError", "Expecting value: event body is not valid JSON"); }
    const q = String(body.question || "").trim();
    if (!q) throw awsError("KeyError", "'question' missing from request body");
    const modelId = cfg.env.MODEL_ID;
    if (!modelById(modelId)) throw awsError("ValidationException", `The provided model identifier is invalid: ${modelId || "(empty)"}`);
    if (!cfg.perms.invoke) throw awsError("AccessDeniedException", `User: arn:aws:sts::123456789012:assumed-role/${fn.name}-role is not authorized to perform: bedrock:InvokeModel on resource: ${modelId}`);
    if (!S.access[modelId]) throw awsError("AccessDeniedException", "You don't have access to the model with the specified model ID.");
    log(g, `strands-agents: agent starting, ${cfg.env.KB_ID ? "1 tool available (retrieve_context)" : "no tools registered"}`);

    let prompt = q, usedTool = false;
    // The agent decides for itself whether the question needs the retrieve_context tool.
    const wantsRetrieval = !!cfg.env.KB_ID && /[a-z]{4,}/i.test(q);
    if (wantsRetrieval) {
      log(g, `Agent reasoning: this question likely needs document context, calling retrieve_context`);
      if (!cfg.perms.retrieve) throw awsError("AccessDeniedException", `User: arn:aws:sts::123456789012:assumed-role/${fn.name}-role is not authorized to perform: bedrock:Retrieve (tool call: retrieve_context)`);
      if (!S.kb || S.kb.id !== cfg.env.KB_ID) throw awsError("ResourceNotFoundException", `Knowledge base ${cfg.env.KB_ID} not found`);
      if (S.kb.status !== "Synced") throw awsError("ValidationException", `Knowledge base ${cfg.env.KB_ID} has no synced data source`);
      const hits = retrieve(q);
      log(g, `Tool call: retrieve_context(query=${JSON.stringify(q.slice(0, 60))}) -> ${hits.length} chunks from ${cfg.env.KB_ID}`);
      usedTool = true;
      if (hits.length) prompt = `Use only this context to answer. If the answer isn't in it, say you don't know.\n\nContext:\n${hits.map((h) => h.text).join("\n\n")}\n\nQuestion: ${q}`;
    } else if (cfg.env.KB_ID) {
      log(g, `Agent reasoning: question doesn't need document context, answering directly (retrieve_context not called)`);
    }
    const r = await callModel(modelId, prompt, { maxWords: 120 });
    const ms = Math.round(performance.now() - t0);
    log(g, `Model ${modelId}: ${r.inT} input tokens, ${r.outT} output tokens${usedTool ? " (after 1 tool call)" : ""}`);
    log(g, `END RequestId: ${reqId}`);
    log(g, `REPORT RequestId: ${reqId} Duration: ${ms} ms Billed Duration: ${Math.ceil(ms / 1) } ms Memory Size: 256 MB`, "t");
    S.metrics.cost += 0.0000002 + (ms / 1000) * 0.25 * 0.0000166667;
    return { statusCode: 200, body: JSON.stringify({ answer: r.text }) };
  } catch (e) {
    S.metrics.fnErr++;
    log(g, `[ERROR] ${e.code || "Error"}: ${e.message}`, "e");
    log(g, `END RequestId: ${reqId}`);
    return { errorType: e.code || "Error", errorMessage: e.message, _failed: true };
  } finally { save(); }
}
async function callApi(bodyText) {
  const a = S.api, g = `API-Gateway-Execution-Logs_${a.id}/prod`;
  S.metrics.apiReq++;
  let status, body;
  if (!a.deployed) { status = 403; body = { message: "Forbidden" }; }
  else if (a.targetType === "statemachine") {
    if (!S.sfn || S.sfn.name !== a.target || !S.sfn.live) { status = 500; body = { message: "Internal Server Error" }; log(g, `Integration target ${a.target} not found or not deployed`, "e"); S.metrics.api5xx++; }
    else if (a.invocationType === "async") {
      const execId = rid();
      log(g, `POST /ask 200 (states:StartExecution -> ${execId})`);
      status = 200; body = { executionArn: execId, status: "RUNNING" };
      runStateMachine(bodyText, execId); // not awaited: the execution keeps running after this response is sent
    } else {
      const res = await runStateMachine(bodyText, rid());
      if (res.status === "FAILED") { status = 500; body = { message: "Execution failed", error: res.error }; S.metrics.api5xx++; }
      else { status = 200; body = res.output; }
    }
  }
  else if (!S.fn || S.fn.name !== a.target || !S.fn.live) { status = 500; body = { message: "Internal Server Error" }; log(g, `Integration target ${a.target} not found or not deployed`, "e"); S.metrics.api5xx++; }
  else {
    const res = await invokeFunction({ body: bodyText, httpMethod: "POST", path: "/ask" });
    if (res._failed) { status = 502; body = { message: "Internal server error" }; S.metrics.api5xx++; log(g, `Lambda invocation failed: ${res.errorType}. Check /aws/lambda/${S.fn.name}`, "e"); }
    else { status = res.statusCode; body = JSON.parse(res.body); }
  }
  log(g, `POST /ask ${status}`);
  S.metrics.cost += 0.0000035; save();
  return { status, body };
}

// ---------- Step Functions execution simulation ----------
const SFN_BLOCKS = [
  { type: "task-lambda", label: "Invoke Lambda (your function)", desc: "Runs your deployed Lambda function, Strands agent and all." },
  { type: "task-bedrock", label: "Call Bedrock model directly", desc: "No Lambda in between. Uses the model set on your Lambda function." },
  { type: "wait", label: "Wait 1 second", desc: "Pauses the execution for a fixed time." },
  { type: "choice", label: "Choice: stop if the previous step failed", desc: "Branches to the Fail state on error, otherwise continues." },
  { type: "map", label: "Map: ask 3 questions in parallel", desc: "Fans out to several Lambda invocations at once." },
];
async function runStateMachine(bodyText, execId) {
  const sm = S.sfn, g = `/aws/states/${sm.name}`;
  const exec = (S.executions[execId] = { status: "RUNNING", history: [], startedAt: now() });
  log(g, `START execution ${execId}`);
  let question = ""; try { question = JSON.parse(bodyText || "{}").question || ""; } catch {}
  let lastOk = true, lastAnswer = "";
  for (const st of sm.live) {
    const row = { state: st.label, status: "RUNNING" }; exec.history.push(row); render(); save();
    try {
      if (st.type === "task-lambda") {
        if (!S.fn?.live) throw awsError("ResourceNotReady", "The Lambda function this step calls has no deployed version.");
        const res = await invokeFunction({ body: JSON.stringify({ question }), httpMethod: "POST", path: "/ask" }, S.fn.live);
        if (res._failed) throw awsError(res.errorType, res.errorMessage);
        lastAnswer = JSON.parse(res.body).answer; lastOk = true;
      } else if (st.type === "task-bedrock") {
        const modelId = S.fn?.live?.env?.MODEL_ID;
        if (!modelId || !modelById(modelId)) throw awsError("ValidationException", "No model configured. Set MODEL_ID on your Lambda function and deploy it first.");
        if (!S.access[modelId]) throw awsError("AccessDeniedException", "You don't have access to the model with the specified model ID.");
        const r = await callModel(modelId, question, { maxWords: 120 }); lastAnswer = r.text; lastOk = true;
      } else if (st.type === "wait") {
        await new Promise((r) => setTimeout(r, 500));
      } else if (st.type === "choice") {
        if (!lastOk) throw awsError("States.TaskFailed", "The previous step failed; the Choice state routed to the Fail state.");
      } else if (st.type === "map") {
        if (!S.fn?.live) throw awsError("ResourceNotReady", "The Lambda function this step calls has no deployed version.");
        const qs = ["What is your return policy?", "How long is the warranty?", "Do you cover accidental damage?"];
        const results = await Promise.all(qs.map((q) => invokeFunction({ body: JSON.stringify({ question: q }), httpMethod: "POST", path: "/ask" }, S.fn.live)));
        const failed = results.filter((r) => r._failed).length;
        row.detail = `${results.length - failed} of ${results.length} iterations succeeded`;
        if (failed) throw awsError("States.TaskFailed", `${failed} Map iteration(s) failed`);
        lastAnswer = `Answered ${qs.length} questions in parallel.`; lastOk = true;
      }
      row.status = "SUCCEEDED"; log(g, `State "${st.label}": SUCCEEDED`);
    } catch (e) {
      row.status = "FAILED"; row.detail = e.message;
      log(g, `[ERROR] State "${st.label}": ${e.code || "Error"}: ${e.message}`, "e");
      exec.status = "FAILED"; exec.error = e.message; exec.finishedAt = now(); save(); render();
      return { status: "FAILED", error: e.message };
    }
    render(); save();
  }
  exec.status = "SUCCEEDED"; exec.output = { answer: lastAnswer }; exec.finishedAt = now(); save(); render();
  log(g, "SUCCEEDED");
  return { status: "SUCCEEDED", output: { answer: lastAnswer } };
}

// ---------- actions ----------
function flash(msg) { ui.s3msg = msg; }
const ACT = {
  grant(el) { const id = el.dataset.id; S.access[id] = "pending"; save(); render(); setTimeout(() => { S.access[id] = true; save(); render(); }, 1200); },
  revoke(el) { delete S.access[el.dataset.id]; save(); render(); },
  async run() {
    const p = ui.play; p.prompt = $("#pprompt").value; p.model = $("#pmodel").value;
    if (!p.prompt.trim()) { p.err = "Enter a prompt first."; render(); return; }
    p.busy = true; p.err = ""; render();
    try { p.out = await callModel(p.model, p.prompt); S.did.playground = true; }
    catch (e) { p.err = `The model call failed: ${e?.message || "unknown error"}`; }
    p.busy = false; save(); render();
  },
  mkbucket() {
    const n = $("#bname").value.trim();
    if (!/^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$/.test(n)) return flash("!Bucket names must be 3 to 63 characters: lowercase letters, numbers and hyphens, starting and ending with a letter or number."), render();
    if (S.buckets.some((b) => b.name === n)) return flash("!BucketAlreadyExists: that name is taken. Bucket names are unique across all of AWS."), render();
    S.buckets.push({ name: n, objects: [] }); flash(`Created bucket ${n}.`); save(); render();
  },
  rmbucket(el) {
    const b = S.buckets[+el.dataset.i];
    if (b.objects.length) return flash("!BucketNotEmpty: delete the objects in the bucket first."), render();
    if (S.kb?.bucket === b.name) return flash("!This bucket is the data source for a knowledge base. Delete the knowledge base first."), render();
    S.buckets.splice(+el.dataset.i, 1); flash(`Deleted bucket ${b.name}.`); save(); render();
  },
  samples(el) { const b = S.buckets[+el.dataset.i]; SAMPLE_DOCS.forEach((d) => { if (!b.objects.some((o) => o.key === d.key)) b.objects.push({ ...d }); }); if (S.kb?.bucket === b.name) S.kb.status = "Not synced"; flash(`Uploaded ${SAMPLE_DOCS.length} sample documents.`); save(); render(); },
  rmobj(el) { const b = S.buckets[+el.dataset.i]; b.objects.splice(+el.dataset.j, 1); if (S.kb?.bucket === b.name) S.kb.status = "Not synced"; flash("Deleted object."); save(); render(); },
  mkkb() { S.kb = { id: "KB" + rid().slice(0, 8).toUpperCase(), name: $("#kbname").value.trim() || "docs-kb", bucket: $("#kbsrc").value, status: "Not synced", chunks: [], files: 0 }; save(); render(); },
  rmkb() { S.kb = null; ui.kbTest = null; save(); render(); },
  sync() {
    S.kb.status = "Syncing"; render();
    setTimeout(() => { const b = S.buckets.find((x) => x.name === S.kb.bucket); S.kb.chunks = chunkDocs(b ? b.objects : []); S.kb.files = b ? b.objects.length : 0; S.kb.status = "Synced"; save(); render(); }, 1500);
  },
  kbtest() { const q = $("#kbq").value; ui.kbTest = { q, hits: retrieve(q) }; render(); },
  mkfn() {
    const n = $("#fnname").value.trim();
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(n)) { alert("Function names use letters, numbers, hyphens and underscores."); return; }
    S.fn = { name: n, env: { MODEL_ID: "", KB_ID: "" }, perms: { invoke: false, retrieve: false }, code: LAMBDA_CODE, deployed: false, live: null }; save(); render();
  },
  rmfn() { S.fn = null; ui.fnTest = null; save(); render(); },
  deploy() { readFn(); S.fn.deployed = true; S.fn.live = { env: { ...S.fn.env }, perms: { ...S.fn.perms } }; save(); render(); },
  async fntest() {
    readFn(); const ev = $("#fnevent").value; ui.fnTest = { event: ev, busy: true }; render();
    let event; try { event = JSON.parse(ev); } catch { ui.fnTest = { event: ev, res: { errorType: "InvalidRequestContentException", errorMessage: "Could not parse test event as JSON", _failed: true } }; render(); return; }
    ui.fnTest.res = await withLive(() => invokeFunction(event)); ui.fnTest.busy = false; render();
  },
  mkapi() {
    const type = $("#apitargettype")?.value || "lambda";
    S.api = { id: rid().slice(0, 10), name: $("#apiname").value.trim() || "ask-api", targetType: type,
      target: type === "statemachine" ? S.sfn.name : S.fn.name, invocationType: "sync", deployed: false };
    save(); render();
  },
  rmapi() { S.api = null; ui.apiTest = null; save(); render(); },
  apideploy() { S.api.deployed = true; save(); render(); },
  async apitest() { const body = $("#apibody").value; ui.apiTest = { body, busy: true }; render(); ui.apiTest.res = await withLive(() => callApi(body)); ui.apiTest.busy = false; render(); },
  mksfn() {
    const n = $("#sfnname").value.trim();
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(n)) { alert("State machine names use letters, numbers, hyphens and underscores."); return; }
    S.sfn = { name: n, states: [], deployed: false, live: null }; save(); render();
  },
  rmsfn() {
    if (S.api?.targetType === "statemachine" && S.api.target === S.sfn.name) { alert("Delete the API using this state machine first."); return; }
    S.sfn = null; ui.sfnTest = null; save(); render();
  },
  sfnadd(el) { const b = SFN_BLOCKS.find((x) => x.type === el.dataset.type); S.sfn.states.push({ type: b.type, label: b.label }); S.sfn.deployed = false; save(); render(); },
  sfnrm(el) { S.sfn.states.splice(+el.dataset.i, 1); S.sfn.deployed = false; save(); render(); },
  sfnup(el) { const i = +el.dataset.i; if (i > 0) { const s = S.sfn.states; [s[i - 1], s[i]] = [s[i], s[i - 1]]; S.sfn.deployed = false; save(); render(); } },
  sfndown(el) { const i = +el.dataset.i, s = S.sfn.states; if (i < s.length - 1) { [s[i], s[i + 1]] = [s[i + 1], s[i]]; S.sfn.deployed = false; save(); render(); } },
  sfndeploy() { if (!S.sfn.states.length) return; S.sfn.deployed = true; S.sfn.live = JSON.parse(JSON.stringify(S.sfn.states)); save(); render(); },
  async sfntest() {
    const q = $("#sfnq").value.trim() || "What is your return policy?";
    ui.sfnTest = { q, busy: true, history: [], result: null }; render();
    const execId = rid();

  async chat() {

    if (res.status === 200 && res.body?.status === "RUNNING" && res.body?.executionArn) {
      const id = res.body.executionArn;

      const apiGroup = `API-Gateway-Execution-Logs_${S.api.id}/prod`;
      let done = false;
      for (let n = 0; n < 12 && !done; n++) {
        await new Promise((r) => setTimeout(r, 500));
        const exec = S.executions[id];
        log(apiGroup, `GET /executions/${id} -> ${exec?.status || "UNKNOWN"}`);
        if (exec && exec.status !== "RUNNING") {
          ui.chat.push(exec.status === "SUCCEEDED" ? { r: "a", t: exec.output.answer } : { r: "x", t: `Execution failed: ${exec.error}` });
          done = true; S.did.clientCall = true;

    } else {
      ui.chat.push(res.status === 200 ? { r: "a", t: res.body.answer } : { r: "x", t: `Something went wrong (HTTP ${res.status}). Check CloudWatch logs.` });
      if (res.status === 200) S.did.clientCall = true;
    }
    ui.chatBusy = false; save(); render(); const n = $("#chatin"); if (n) n.focus();
  },
};
function readFn() {

}
// run with the last deployed config (undeployed edits don't take effect)
async function withLive(fnc) {
  const f = S.fn;
  if (!f || !f.live) return fnc();
  const saved = { env: f.env, perms: f.perms };
  f.env = { ...f.live.env }; f.perms = { ...f.live.perms };
  try { return await fnc(); } finally { f.env = saved.env; f.perms = saved.perms; save(); }
}

const LEVELS = [
  ["reflex", "Reflex", "One instant guess, no check."],
  ["deliberation", "Deliberation", "Reasons step by step, no check."],
  ["metacognition", "Metacognition", "Drafts, then checks itself once against both sentences. Recommended."],
  ["planning", "Planning", "Calls graph tools to stay grounded, drafts, checks, and retries once if wrong."],
];
const STAKES = { low: { need: 0.6, label: "Low" }, medium: { need: 0.8, label: "Medium" }, high: { need: 1.0, label: "High" } };
const DEFAULTS = { neural: { threshold: 0.5, strong: 0.85, coverage: 0.4 }, lexical: { threshold: 0.12, strong: 0.5, coverage: 0.15 } };
const PALETTE = ["#0F6E8C", "#C2410C", "#6D28D9", "#15803D", "#B45309", "#BE185D", "#0E7490", "#4D7C0F", "#9F1239", "#1D4ED8"];
const freshSkgUi = () => ({ sel: null, level: "metacognition", why: null, whyBusy: false, steps: [], building: false, mode: "check", stakes: "medium", q: "", result: null, busy: false });
ui.skg = freshSkgUi();
let SKGE = null; // lexical fallback index

// One model call, metered as if it ran on Bedrock (quick = Haiku prices, default = Sonnet prices)
async function local(prompt, { tier = "quick", json = false, maxTokens = 300, temperature = 0.3, group = "/aws/states/skg" } = {}) {
  let r = await llmChat(prompt, { json, maxTokens, temperature });
  let out = r.text;
  if (json) { try { out = parseJSON(r.text); } catch { r = await llmChat(prompt + "\nReturn only valid JSON, nothing else.", { json, maxTokens, temperature: 0 }); out = parseJSON(r.text); } }
  const m = modelById(tier === "quick" ? "anthropic.claude-haiku" : "anthropic.claude-sonnet");
  const cost = (r.inT * m.inP + r.outT * m.outP) / 1000;
  S.metrics.modelCalls++; S.metrics.inTok += r.inT; S.metrics.outTok += r.outT; S.metrics.cost += cost;
  log(group, `bedrock:Converse (local ${shortName(LLM.chatId)}) in=${r.inT} out=${r.outT}`);
  return { out, inT: r.inT, outT: r.outT, cost };
}
const G = () => S.graph;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function skgEdges() { const g = G(); return g.sims.filter((e) => e.w >= g.threshold && !(g.verify[`${e.a}-${e.b}`]?.related === false)); }
function skgRecompute() { const g = G(), E = skgEdges(); g.comm = SKG.louvain(g.sentences.length, E); g.pos = SKG.layout(g.sentences.length, E, g.comm); }
async function similarTo(text, k) {
  const g = G(); let scores;
  if (g.mode === "neural") { const [q] = await llmEmbed([ARCTIC_QUERY + text]); scores = g.vecs.map((v) => dot(q, v)); }
  else { if (!SKGE) SKGE = SKG.embed(g.sentences); const q = SKGE.query(text); scores = SKGE.vecs.map((v) => SKG.cos(q, v)); }
  return g.sentences.map((s, i) => ({ node: i, sentence: s, score: scores[i] })).sort((a, b) => b.score - a.score).slice(0, k);
}
const yes = (v) => v === true || /^(true|yes)$/i.test(String(v));

async function skgBuild() {
  const text = $("#skgtext").value.trim(), doVerify = $("#skgverify")?.checked;
  const sentences = SKG.splitSentences(text);
  if (sentences.length < 3) { ui.skg.steps = [{ name: "Split into sentences", svc: "Lambda", st: "fail", d: "Need at least 3 sentences. Paste more text or load a sample." }]; render(); return; }
  const grp = "/aws/states/skg-build", steps = (ui.skg.steps = []);
  const step = async (name, svc, fn) => { const s = { name, svc, st: "run", d: "" }; steps.push(s); render();
    try { s.d = (await fn((d) => { s.d = d; render(); })) || ""; s.st = "ok"; log(grp, `${name}: ${s.d}`); render(); }
    catch (e) { s.st = "fail"; s.d = e.message; log(grp, `[ERROR] ${name}: ${e.message}`, "e"); render(); throw e; } };
  const mode = llmReady() ? "neural" : "lexical";
  ui.skg.building = true; ui.skg.sel = null; ui.skg.why = null; ui.skg.result = null;
  const g = { text, sentences, mode, vecs: [], sims: [], verify: {}, ...DEFAULTS[mode], comm: [], pos: [] };
  try {
    log(grp, `START execution ${rid()} (${mode} embeddings)`);
    await step("Store source", "S3 PutObject", async () => { await wait(200); return `s3://kg-source/source.txt, ${text.length.toLocaleString()} bytes`; });
    await step("Split into sentences", "Lambda", async () => { await wait(200); return `${sentences.length} sentences${sentences.length === 80 ? " (limit 80)" : ""}`; });
    await step("Create embeddings", mode === "neural" ? `Bedrock embeddings (local ${shortName(LLM.embId)})` : "Word-overlap fallback (no model loaded)", async () => {
      if (mode === "neural") { g.vecs = await llmEmbed(sentences); return `${sentences.length} vectors, ${g.vecs[0].length} dimensions`; }
      SKGE = SKG.embed(sentences); return `${sentences.length} sparse vectors. Load models for real embeddings.`;
    });
    await step("Link similar sentences", "Neptune Analytics, vector similarity", async () => {
      if (mode === "neural") { for (let i = 0; i < g.vecs.length; i++) for (let j = i + 1; j < g.vecs.length; j++) { const w = dot(g.vecs[i], g.vecs[j]); if (w > 0.2) g.sims.push({ a: i, b: j, w: +w.toFixed(3) }); } }
      else g.sims = SKG.similarities(SKGE.vecs);
      S.graph = g; return `${skgEdges().length} edges at threshold ${g.threshold}`;
    });
    if (doVerify && llmReady()) await step("Verify strong matches", `Bedrock, local ${shortName(LLM.chatId)}`, async (progress) => {
      const strong = g.sims.filter((e) => e.w >= g.strong).sort((a, b) => b.w - a.w).slice(0, 12);
      if (!strong.length) return `No pairs above ${g.strong}`;
      let ok = 0, rej = 0, con = 0;
      for (const [k, e] of strong.entries()) {
        progress(`Checking pair ${k + 1} of ${strong.length}…`);
        const r = await local(`Sentence A: ${g.sentences[e.a]}\nSentence B: ${g.sentences[e.b]}\nFirst draft a judgment, then re-read both sentences and check it once before answering.\n"related": are A and B about the same subject or idea?\n"contradiction": do A and B make claims that cannot both be true?\n"relation": the link in at most 8 words.\nReturn JSON: {"related": true, "contradiction": false, "relation": "..."}`, { json: true, maxTokens: 120, group: grp });
        const v = { related: yes(r.out.related), contradiction: yes(r.out.contradiction), relation: String(r.out.relation || "").slice(0, 80) };
        g.verify[`${e.a}-${e.b}`] = v; v.contradiction && con++; v.related ? ok++ : rej++;
      }
      return `${strong.length} checked: ${ok} confirmed, ${rej} removed, ${con} contradictions flagged`;
    });
    await step("Find communities", "Neptune Analytics, Louvain", async () => { skgRecompute(); return `${new Set(g.comm).size} communities`; });
    log(grp, "SUCCEEDED");
  } catch { if (S.graph !== g) S.graph = null; }
  ui.skg.building = false; save(); render();
}

// Planning level: a small agent loop. The model asks for a tool with JSON; the page runs it and feeds back the result.
async function agentLoop(goal, tools, add, grp) {
  const hist = [];
  for (let s = 0; s < 4; s++) {
    const r = await local(`${goal}\n\nTools you can call:\n${tools.map((t) => `- ${t.name}(${t.args}): ${t.description}`).join("\n")}\n${hist.length ? `\nResults so far:\n${hist.join("\n")}\n` : ""}\nReply with JSON only. To call a tool: {"tool": "name", "input": {...}}. When you have enough grounded facts: {"final": "2 to 4 short facts"}.`, { json: true, maxTokens: 160, group: grp });
    if (r.out.final) { add("Agent finished gathering context"); return String(r.out.final); }
    const t = tools.find((x) => x.name === r.out.tool);
    if (!t) { add(`Agent asked for unknown tool "${r.out.tool}", stopping`); break; }
    let res; try { res = t.run(r.out.input || {}); } catch (e) { res = { error: e.message }; }
    add(`Tool: ${t.name}(${JSON.stringify(r.out.input || {}).slice(0, 60)})`);
    hist.push(`${t.name}(${JSON.stringify(r.out.input || {})}) -> ${JSON.stringify(await res).slice(0, 500)}`);
  }
  return hist.join("\n");
}

async function skgExplain(i, j) {
  const g = G(), level = ui.skg.level, trace = [], grp = "/aws/lambda/skg-explain";
  ui.skg.why = { i, j, level, trace, text: "" }; ui.skg.whyBusy = true; render();
  const add = (t) => { trace.push(t); render(); };
  const base = `Sentence A: ${g.sentences[i]}\nSentence B: ${g.sentences[j]}\n`;
  try {
    if (level === "reflex") {
      const r = await local(`${base}In one sentence, why are these two sentences connected?`, { maxTokens: 70, temperature: 0.7, group: grp });
      add(`One-shot answer, ${r.outT} tokens`); ui.skg.why.text = r.out;
    } else if (level === "deliberation") {
      const r = await local(`${base}Think step by step about what links these two sentences: shared subject, cause, contrast, or category. Then write "Answer:" followed by a one or two sentence explanation.`, { tier: "default", maxTokens: 350, group: grp });
      add(`Step-by-step reasoning, ${r.outT} tokens`); ui.skg.why.text = String(r.out).split(/Answer:/i).pop().trim();
    } else {
      let context = "";
      if (level === "planning") {
        const tools = [
          { name: "graph_neighbors", args: "node", description: "sentences linked to a node number", run: ({ node }) => skgEdges().filter((e) => e.a === +node || e.b === +node).map((e) => g.sentences[e.a === +node ? e.b : e.a]).slice(0, 5) },
          { name: "search_graph", args: "query", description: "the 3 sentences closest in meaning to a query", run: async ({ query }) => (await similarTo(String(query || ""), 3)).map((x) => x.sentence) },
          { name: "calculator", args: "expression", description: "arithmetic like (80*60)/2", run: ({ expression }) => { const e = String(expression); if (!/^[\d\s+\-*/().]+$/.test(e)) throw new Error("Only numbers and + - * / ( )"); return Function(`return (${e})`)(); } },
        ];
        context = await agentLoop(`${base}(A is node ${i}, B is node ${j}.) Gather grounded facts that explain the link between A and B. Call a tool to check yourself before you finish.`, tools, add, grp);
      }
      let draft = await local(`${base}${context ? `Grounded facts:\n${context}\n` : ""}Explain in one or two sentences why A and B are connected.`, { tier: "default", maxTokens: 120, group: grp });
      add(`Draft, ${draft.outT} tokens`);
      const verify = (d) => local(`${base}${context ? `Grounded facts:\n${context}\n` : ""}Proposed explanation: ${d}\nCheck the explanation against the sentences only. Is every claim in it supported?\nReturn JSON: {"valid": true, "issue": "", "final": "the explanation, corrected if needed"}`, { json: true, maxTokens: 160, group: grp });
      let v = await verify(draft.out); add(`Self-check: ${yes(v.out.valid) ? "passed" : "issue found: " + v.out.issue}`);
      if (level === "planning" && !yes(v.out.valid)) {
        draft = await local(`${base}Grounded facts:\n${context}\nA previous explanation had this problem: ${v.out.issue}\nWrite a corrected one or two sentence explanation using only supported facts.`, { tier: "default", maxTokens: 120, group: grp });
        add("Retry draft"); v = await verify(draft.out); add(`Re-check: ${yes(v.out.valid) ? "passed" : "still failing"}`);
      }
      ui.skg.why.text = String(v.out.final || draft.out); ui.skg.why.valid = yes(v.out.valid);
    }
  } catch (e) { ui.skg.why.err = e.message; log(grp, `[ERROR] ${e.code || "Error"}: ${e.message}`, "e"); }
  ui.skg.whyBusy = false; save(); render();
}

async function skgCheck() {
  const g = G(), input = $("#skgq").value.trim(); if (!input) return;
  const stakes = ui.skg.stakes, grp = "/aws/states/skg-verify", cov = +($("#skgcov")?.value || g.coverage);
  g.coverage = cov; ui.skg.q = input; ui.skg.busy = true;
  const R = (ui.skg.result = { claim: input, steps: ["Coverage", "Contradiction", "Confidence", "Stakes-adjusted risk"].map((name) => ({ name, st: "wait", d: "" })), decision: null });
  const set = (k, st, d) => { R.steps[k].st = st; R.steps[k].d = d; render(); };
  const stop = (from, text, kind) => { for (let k = from; k < 4; k++) if (R.steps[k].st === "wait") R.steps[k].st = "skip"; R.decision = { text, kind }; };
  log(grp, `START verify stakes=${stakes}`); render();
  try {
    if (g.mode === "neural" && !llmReady()) throw awsError("ModelNotLoaded", "This graph was built with neural embeddings. Load the same models to check claims.");
    if (ui.skg.mode === "ask") {
      if (!llmReady()) throw awsError("ModelNotLoaded", "Open questions need the local chat model. Load models first.");
      R.pre = "Drafting a checkable claim…"; render();
      const ev = await similarTo(input, 5);
      const r = await local(`Question: ${input}\nRelevant sentences:\n${ev.map((e) => `- ${e.sentence}`).join("\n")}\nDraft ONE specific, checkable claim (a single declarative sentence) that answers the question. Check once that it is specific, not open-ended, and fix it if needed.\nReturn JSON: {"claim": "..."}`, { json: true, maxTokens: 100, group: grp });
      R.claim = String(r.out.claim || input); R.pre = null;
    }
    // 1. Coverage: vector search only, no model call
    const ev = await similarTo(R.claim, 5), top = ev[0]?.score || 0; R.evidence = ev;
    if (top < cov) { set(0, "fail", `Closest sentence scores ${top.toFixed(2)}, below ${cov.toFixed(2)}. The graph doesn't cover this.`); stop(1, "Not covered: the graph doesn't know about this, so no answer is given.", "warn"); return; }
    set(0, "ok", `Closest match ${top.toFixed(2)}: “${ev[0].sentence}”`);
    if (!llmReady()) { set(1, "fail", "Load the local chat model to run the remaining checks."); stop(2, "Only coverage could run without a model.", "warn"); return; }
    // 2. Contradiction: one call
    set(1, "run", "Comparing with graph evidence…");
    const c = await local(`Claim: ${R.claim}\nEvidence:\n${ev.map((e, k) => `${k + 1}. ${e.sentence}`).join("\n")}\nUsing only the evidence, does it support or contradict the claim?\nReturn JSON: {"verdict": "supported" or "contradicted" or "mixed" or "insufficient", "contradicting": [evidence numbers], "reason": "one sentence"}`, { json: true, maxTokens: 150, group: grp });
    const verdict = (String(c.out.verdict || "insufficient").toLowerCase().match(/supported|contradicted|mixed|insufficient/) || ["insufficient"])[0];
    const contradicting = Array.isArray(c.out.contradicting) ? c.out.contradicting : [];
    if (verdict === "contradicted") { set(1, "fail", `Contradicted. ${c.out.reason || ""}`); stop(2, "Contradicted by the graph. Don't use this claim.", "err"); return; }
    set(1, verdict === "supported" ? "ok" : "warn", `${verdict[0].toUpperCase() + verdict.slice(1)}. ${c.out.reason || ""}`);
    // 3. Confidence: ask 5 times, compare
    const votes = [];
    for (let n = 1; n <= 5; n++) {
      set(2, "run", `Asking ${n} of 5…`);
      try { const r = await local(`Claim: ${R.claim}\nEvidence:\n${ev.map((e) => `- ${e.sentence}`).join("\n")}\nIs the claim true according to the evidence? Return JSON: {"answer": "true" or "false" or "unknown"}`, { json: true, maxTokens: 20, temperature: 0.9, group: grp });
        votes.push((String(r.out.answer).toLowerCase().match(/true|false|unknown/) || ["unknown"])[0]); } catch { votes.push("unknown"); }
    }
    const counts = votes.reduce((a, x) => ((a[x] = (a[x] || 0) + 1), a), {}), [maj, n] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0], agree = n / 5; R.votes = votes;
    set(2, agree >= 0.8 ? "ok" : "warn", `${n} of 5 answered “${maj}” (${Math.round(agree * 100)}% agreement)`);
    // 4. Stakes-adjusted risk
    const need = STAKES[stakes].need, clean = verdict === "supported" && !contradicting.length;
    if (maj === "true" && agree >= need && (stakes !== "high" || clean)) { set(3, "ok", `${STAKES[stakes].label} stakes needs ${Math.round(need * 100)}% agreement${stakes === "high" ? " and clean evidence" : ""}. Met.`); R.decision = { text: "Trusted for this level of stakes.", kind: "ok" }; }
    else if (stakes === "high") { set(3, "fail", "High stakes needs 100% agreement and clean evidence. Not met."); R.decision = { text: "Sent to human review (on AWS, Step Functions pauses with a task token until someone approves).", kind: "warn" }; }
    else { set(3, "fail", `${STAKES[stakes].label} stakes needs ${Math.round(need * 100)}% agreement on “true”. Not met.`); R.decision = { text: maj === "false" ? "The graph says this is false." : "Not reliable enough. Don't use this claim as fact.", kind: "err" }; }
  } catch (e) {
    const k = R.steps.findIndex((s) => s.st === "run" || s.st === "wait"); if (k >= 0) set(k, "fail", e.message); stop(Math.max(k + 1, 0), "The check stopped because of an error.", "err");
    log(grp, `[ERROR] ${e.code || "Error"}: ${e.message}`, "e");
  } finally { R.pre = null; ui.skg.busy = false; log(grp, `END decision=${R.decision?.kind}`); save(); render(); }
}

const stIcon = (st) => ({ ok: `<span class="badge b-ok">Passed</span>`, fail: `<span class="badge b-err">Failed</span>`, warn: `<span class="badge b-warn">Caution</span>`, run: `<span class="badge b-warn">Running…</span>`, skip: `<span class="badge b-gray">Skipped</span>`, wait: `<span class="badge b-gray">Waiting</span>` }[st]);
const modelNote = () => llmReady() ? "" : `<div class="alert info">${LLM.webgpu ? "Local models aren't loaded, so the graph uses a word-overlap fallback and the model steps are off." : "WebGPU isn't available in this browser, so the graph uses a word-overlap fallback and the model steps are off."} <button class="btn sm" data-go="models">Local models</button></div>`;
V.skgbuild = () => {
  const g = G(), s = ui.skg;
  let html = head("Knowledge graph lab › Build graph", "Semantic knowledge graph", "Sentences become nodes and similar meanings become edges. On AWS this is a Step Functions workflow: S3, Lambda, Bedrock embeddings, and Neptune Analytics for similarity and communities. Here, local models on your GPU stand in for Bedrock.") + modelNote() +
    `<div class="card"><div class="hd"><h2>Source text</h2><div class="row"><button class="btn sm" data-act="skgsample" data-k="animals">Animals sample</button><button class="btn sm" data-act="skgsample" data-k="insurance">Insurance sample</button></div></div><div class="bd" style="display:grid;gap:10px">
    <textarea id="skgtext" style="min-height:120px" placeholder="Paste a few paragraphs. Each sentence becomes a node.">${esc(g?.text || "")}</textarea>
    <label><input type="checkbox" id="skgverify" ${llmReady() ? "checked" : "disabled"}> Verify strong matches before connecting them <span class="muted">(Metacognition, checks for contradictions)</span></label>
    <div><button class="btn primary" data-act="skgbuild" ${s.building ? "disabled" : ""}>${s.building ? "Building…" : "Build the graph"}</button></div></div></div>`;
  if (s.steps.length) html += `<div class="card"><div class="hd"><h2>Step Functions execution</h2></div><div class="tw"><table><tbody>${s.steps.map((x, k) => `<tr><td style="width:28px" class="muted">${k + 1}</td><td><b>${x.name}</b><br><span class="muted" style="font-size:13px">${esc(x.svc)}</span></td><td>${stIcon(x.st)}<div style="font-size:13px;margin-top:2px">${esc(x.d)}</div></td></tr>`).join("")}</tbody></table></div></div>`;
  if (g && g.comm?.length && !s.building) {
    const E = skgEdges(), nC = new Set(g.comm).size;
    html += `<div class="metrics"><div><b>${g.sentences.length}</b><span>Nodes</span></div><div><b>${E.length}</b><span>Edges</span></div><div><b>${nC}</b><span>Communities (Louvain)</span></div><div><b>${(2 * E.length / g.sentences.length).toFixed(1)}</b><span>Average degree</span></div></div>
    <div class="card"><div class="hd"><div><h2>Graph</h2><span class="muted" style="font-size:13px">${g.mode === "neural" ? "Neural embeddings" : "Word-overlap fallback"}</span></div><label class="field" style="min-width:170px">Edge threshold ${g.threshold.toFixed(2)}<input type="range" id="skgth" min="${g.mode === "neural" ? 0.3 : 0.1}" max="${g.mode === "neural" ? 0.9 : 0.6}" step="0.01" value="${g.threshold}"></label></div><div class="bd">
    <svg viewBox="0 0 600 420" style="width:100%;height:auto;background:var(--sunk);border-radius:6px" role="img" aria-label="Knowledge graph">
    ${E.map((e) => { const v = g.verify[`${e.a}-${e.b}`], p = g.pos[e.a], q = g.pos[e.b]; return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${v?.contradiction ? "var(--err)" : "#8A99A8"}" stroke-width="${(0.6 + e.w * 3).toFixed(1)}" stroke-opacity="${v?.contradiction ? 0.95 : 0.3 + e.w * 0.5}" ${v?.contradiction ? 'stroke-dasharray="6 4"' : ""}/>`; }).join("")}
    ${g.pos.map((p, i) => `<g data-act="skgnode" data-i="${i}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="${s.sel === i ? 13 : 10}" fill="${PALETTE[g.comm[i] % PALETTE.length]}" stroke="${s.sel === i ? "var(--ink)" : "#fff"}" stroke-width="${s.sel === i ? 3 : 1.5}"/><text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" pointer-events="none">${i}</text></g>`).join("")}
    </svg><p class="note">Tap a node to inspect it. Colors are communities. Red dashed lines are links the model flagged as contradictions.</p></div></div>`;
    if (s.sel != null && g.sentences[s.sel]) {
      const i = s.sel, nb = E.filter((e) => e.a === i || e.b === i).map((e) => ({ o: e.a === i ? e.b : e.a, w: e.w, v: g.verify[`${e.a}-${e.b}`] })).sort((a, b) => b.w - a.w);
      const W = s.why && (s.why.i === i || s.why.j === i) ? s.why : null;
      html += `<div class="card"><div class="hd"><h2>Node ${i}</h2><span class="badge" style="background:${PALETTE[g.comm[i] % PALETTE.length]};color:#fff">Community ${g.comm[i] + 1}</span></div><div class="bd" style="display:grid;gap:12px">
      <p>${esc(g.sentences[i])}</p>
      <div><h3 style="margin-bottom:6px">Level of thinking for “Why?”</h3>${LEVELS.map(([k, t, d]) => `<label style="display:block;padding:4px 0"><input type="radio" name="skglevel" value="${k}" ${s.level === k ? "checked" : ""}> <b>${t}</b> <span class="muted" style="font-size:13px">${d}</span></label>`).join("")}</div>
      ${nb.length ? `<div class="tw"><table><thead><tr><th>Linked to</th><th>Similarity</th><th></th></tr></thead><tbody>${nb.map((x) => `<tr><td><b>${x.o}</b> ${esc(g.sentences[x.o])}${x.v ? `<div style="margin-top:3px">${x.v.contradiction ? `<span class="badge b-err">Contradiction</span> ` : `<span class="badge b-ok">Verified</span> `}<span class="muted" style="font-size:13px">${esc(x.v.relation)}</span></div>` : ""}</td><td class="mono">${x.w.toFixed(2)}</td><td><button class="btn sm" data-act="skgwhy" data-j="${x.o}" ${s.whyBusy || !llmReady() ? "disabled" : ""}>Why?</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No links at this threshold. Lower the edge threshold to connect it.</p>`}
      ${W ? `<div class="card" style="margin:0"><div class="hd"><h3>Why ${W.i} and ${W.j} connect, ${LEVELS.find((l) => l[0] === W.level)[1]}</h3>${W.valid === false ? `<span class="badge b-warn">Check flagged an issue</span>` : W.valid ? `<span class="badge b-ok">Checked</span>` : ""}</div><div class="bd">
        ${W.trace.length ? `<div style="margin-bottom:8px">${W.trace.map((t) => `<div class="mono muted" style="font-size:12px">› ${esc(t)}</div>`).join("")}</div>` : ""}
        ${W.err ? `<div class="alert err">${esc(W.err)}</div>` : W.text ? `<p>${esc(W.text)}</p>` : `<p class="muted">Thinking…</p>`}</div></div>` : ""}
      </div></div>`;
    }
  }
  return html;
};
V.skgask = () => {
  const g = G(), s = ui.skg, R = s.result;
  if (!g || !g.comm?.length) return head("Knowledge graph lab › Ask and verify", "Ask and verify", "Check a claim against the graph with four levels of verification.") + `<div class="alert info">Build a graph first. <button class="btn sm" data-go="skgbuild">Go to Build graph</button></div>`;
  return head("Knowledge graph lab › Ask and verify", "Ask and verify", "Checks run cheapest first and stop early: coverage (vector search, no model call), contradiction (one call), confidence (five calls), then a stakes rule. On AWS this is a Step Functions workflow.") + modelNote() +
  `<div class="card"><div class="bd" style="display:grid;gap:12px">
    <div class="row"><div style="display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden">${[["check", "Check a statement"], ["ask", "Ask an open question"]].map(([k, t]) => `<button class="btn" style="border:0;border-radius:0;${s.mode === k ? "background:var(--ink);color:#fff" : ""}" data-act="skgmode" data-k="${k}" aria-pressed="${s.mode === k}">${t}</button>`).join("")}</div>
    <label class="field" style="min-width:140px">Stakes<select id="skgstakes">${Object.entries(STAKES).map(([k, v]) => `<option value="${k}" ${s.stakes === k ? "selected" : ""}>${v.label} (needs ${Math.round(v.need * 100)}%)</option>`).join("")}</select></label>
    <label class="field" style="width:130px">Coverage threshold<input type="number" id="skgcov" min="0" max="1" step="0.01" value="${g.coverage}"></label></div>
    <label class="field">${s.mode === "check" ? "Statement" : "Question"}<input type="text" id="skgq" value="${esc(s.q)}" placeholder="${s.mode === "check" ? "Cats and dogs are both commonly kept as pets" : "Is flood damage covered by a homeowners policy?"}"></label>
    <p class="note" style="margin:0">${s.mode === "check" ? "Works best as a specific claim. An open question has nothing clean to verify." : "The model first drafts one specific, checkable claim from your question, then runs the same four checks."}</p>
    <div><button class="btn primary" data-act="skgcheck" ${s.busy ? "disabled" : ""}>${s.busy ? "Checking…" : s.mode === "check" ? "Check" : "Answer and verify"}</button></div></div></div>
  ${R ? `<div class="card"><div class="hd"><h2>Verification</h2></div><div class="bd" style="display:grid;gap:10px">
    ${R.pre ? `<p class="muted">${R.pre}</p>` : `<p><span class="muted">Claim checked:</span> <b>${esc(R.claim)}</b></p>`}
    <div class="tw"><table><tbody>${R.steps.map((x, k) => `<tr><td style="width:28px" class="muted">${k + 1}</td><td><b>${x.name}</b></td><td>${stIcon(x.st)}<div style="font-size:13px;margin-top:2px">${esc(x.d)}</div></td></tr>`).join("")}</tbody></table></div>
    ${R.votes ? `<p class="note" style="margin:0">Votes: ${R.votes.map(esc).join(", ")}</p>` : ""}
    ${R.decision ? `<div class="alert ${R.decision.kind === "ok" ? "ok" : R.decision.kind === "warn" ? "info" : "err"}" style="margin:0"><b>${esc(R.decision.text)}</b></div>` : ""}
    ${R.evidence ? `<details><summary class="muted" style="cursor:pointer;font-size:14px">Evidence used</summary>${R.evidence.map((e, k) => `<div class="chunk"><span class="muted" style="font-size:12px">${k + 1}. node ${e.node}, score ${e.score.toFixed(2)}</span><br>${esc(e.sentence)}</div>`).join("")}</details>` : ""}
  </div></div>` : ""}`;
};
V.models = () => {
  const busy = LLM.status === "loading";
  return head("Local models", "Local models", "This sandbox runs real models in your browser with WebLLM on WebGPU. They stand in for Bedrock: the chat model answers as the Bedrock model you pick, and Arctic Embed plays the role of Titan Embeddings. Nothing you type leaves your device.") +
  (!LLM.webgpu ? `<div class="alert err">WebGPU isn't available in this browser. Use a recent Chrome or Edge on desktop, or Safari 26 or later. Everything else in the sandbox still works, with placeholder model answers.</div>` : "") +
  `<div class="card"><div class="bd" style="display:grid;gap:12px">
    <div class="row">
      <label class="field" style="flex:1;min-width:200px">Embedding model<select id="pickembed" ${busy ? "disabled" : ""}>${LOCAL.embed.map(([id, n, d]) => `<option value="${id}" ${LLM.pick.embed === id ? "selected" : ""}>${n}: ${d}</option>`).join("")}</select></label>
      <label class="field" style="flex:1;min-width:200px">Chat model<select id="pickchat" ${busy ? "disabled" : ""}>${LOCAL.chat.map(([id, n, d]) => `<option value="${id}" ${LLM.pick.chat === id ? "selected" : ""}>${n}: ${d}</option>`).join("")}</select></label>
    </div>
    <div><button class="btn primary" data-act="loadmodels" ${!LLM.webgpu || busy ? "disabled" : ""}>${busy ? "Loading…" : llmReady() ? "Reload with these models" : "Load models"}</button></div>
    ${busy ? `<div data-llmprog><progress value="${LLM.progress}" max="1" style="width:100%"></progress><p class="note ptext">${esc(LLM.text)}</p></div>` : ""}
    ${llmReady() ? `<div class="alert ok" style="margin:0">Ready: ${shortName(LLM.chatId)} and ${shortName(LLM.embId)}.</div>` : ""}
    ${LLM.status === "error" ? `<div class="alert err" style="margin:0">${esc(LLM.err)}</div>` : ""}
    <p class="note" style="margin:0">The first load downloads the weights, then the browser caches them. Later loads take seconds.</p>
  </div></div>`;
};
Object.assign(ACT, {
  skgsample(el) { const t = $("#skgtext"); if (t) t.value = SKG_SAMPLES[el.dataset.k]; },
  skgbuild() { skgBuild(); },
  skgnode(el) { ui.skg.sel = +el.dataset.i; render(); },
  skgwhy(el) { skgExplain(ui.skg.sel, +el.dataset.j); },
  skgmode(el) { ui.skg.mode = el.dataset.k; ui.skg.result = null; render(); },
  skgcheck() { skgCheck(); },
  loadmodels() { LLM.pick = { embed: $("#pickembed").value, chat: $("#pickchat").value }; loadModels(); },
});
document.addEventListener("input", (e) => { if (e.target.id === "skgth" && G()) { G().threshold = +e.target.value; skgRecompute(); save(); render(); $("#skgth")?.focus(); } });
document.addEventListener("change", (e) => { if (e.target.name === "skglevel") ui.skg.level = e.target.value; if (e.target.id === "skgstakes") ui.skg.stakes = e.target.value; });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "skgq") { e.preventDefault(); if (!ui.skg.busy) skgCheck(); } });

if (S.graph && !S.graph.mode) S.graph = null;
// fix any stuck pending/syncing states from a previous session
Object.keys(S.access).forEach((k) => { if (S.access[k] === "pending") S.access[k] = true; });
if (S.kb?.status === "Syncing") S.kb.status = "Not synced";
render();
})();
</script>
</body>
</html>
