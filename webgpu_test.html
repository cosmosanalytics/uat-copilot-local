<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bespoke Nimble on WebLLM / WebGPU</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      max-width: 900px;
      margin-inline: auto;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    textarea, select, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 14px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #status {
      font-size: 14px;
      color: #38bdf8;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    pre {
      background: #0f172a;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      overflow-x: auto;
      color: #a7f3d0;
    }
  </style>
</head>
<body>
  <h1>Bespoke Nimble WebGPU Evaluator</h1>
  <div class="badge">In-Browser Decision Scoring via WebLLM</div>

  <div class="card">
    <label for="modelUrl">MLC Model Weights URL (HF or S3 with CORS):</label>
    <input id="modelUrl" type="text" value="https://huggingface.co/your-username/Bespoke-Nimble-q4f16_1-MLC/resolve/main/" />
    
    <label for="modelLibUrl" style="margin-top: 12px;">WASM Model Library URL:</label>
    <input id="modelLibUrl" type="text" value="https://huggingface.co/your-username/Bespoke-Nimble-q4f16_1-MLC/resolve/main/bespoke-nimble-webgpu.wasm" />

    <button id="loadBtn">Initialize WebGPU Engine</button>
    <div id="status">Engine not loaded.</div>
  </div>

  <div class="card">
    <label for="prompt">Decision Prompt / Context:</label>
    <textarea id="prompt" rows="5">Is the following user message compliant with safety policies?
User message: "Hello! Could you write a short poem about autumn leaves?"
Answer choices: [Yes, No]</textarea>

    <button id="scoreBtn" disabled>Score Decision</button>
    <div id="result">
      <h3>Prediction & Logits</h3>
      <pre id="output">Results will appear here...</pre>
    </div>
  </div>

  <!-- Load WebLLM from CDN -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    const loadBtn = document.getElementById("loadBtn");
    const scoreBtn = document.getElementById("scoreBtn");
    const statusDiv = document.getElementById("status");
    const outputPre = document.getElementById("output");

    loadBtn.addEventListener("click", async () => {
      loadBtn.disabled = true;
      statusDiv.textContent = "Checking WebGPU support and downloading model weights...";

      try {
        const modelId = "Bespoke-Nimble-Custom";
        const appConfig = {
          model_list: [
            {
              model: document.getElementById("modelUrl").value,
              model_id: modelId,
              model_lib: document.getElementById("modelLibUrl").value,
              vram_required_MB: 5000,
              low_resource_mode: false,
            },
          ],
        };

        engine = await webllm.CreateMLCEngine(modelId, {
          appConfig: appConfig,
          initProgressCallback: (report) => {
            statusDiv.textContent = report.text;
          },
        });

        statusDiv.textContent = "Engine successfully loaded on WebGPU!";
        scoreBtn.disabled = false;
      } catch (err) {
        statusDiv.textContent = "Error initializing WebGPU engine: " + err.message;
        loadBtn.disabled = false;
        console.error(err);
      }
    });

    scoreBtn.addEventListener("click", async () => {
      scoreBtn.disabled = true;
      outputPre.textContent = "Scoring decision tokens on WebGPU...";

      try {
        const promptText = document.getElementById("prompt").value;

        // Bespoke-Nimble scoring pattern: single token generation with logprobs
        const response = await engine.chat.completions.create({
          messages: [{ role: "user", content: promptText }],
          max_tokens: 1,
          temperature: 0.0,
          logprobs: true,
          top_logprobs: 5,
        });

        const choice = response.choices[0];
        const topLogprobs = choice.logprobs?.content?.[0]?.top_logprobs || [];

        const outputData = {
          generated_token: choice.message.content,
          finish_reason: choice.finish_reason,
          candidate_logprobs: topLogprobs.map(lp => ({
            token: lp.token,
            logprob: lp.logprob,
            probability: Math.exp(lp.logprob).toFixed(4)
          })),
        };

        outputPre.textContent = JSON.stringify(outputData, null, 2);
      } catch (err) {
        outputPre.textContent = "Error running scoring: " + err.message;
        console.error(err);
      } finally {
        scoreBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
