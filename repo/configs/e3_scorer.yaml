experiment: "E3_scorer"
method: "Frozen LLM + Logistic Regression on Code-Computed Features"
features:
  context_tasks (HotpotQA):
    - answer_in_context
    - max_emb_sim
    - top2_emb_sim
    - nli_entailment
    - self_consistency
    - format_validity
  no_context_tasks (Math/OOD):
    - self_consistency
    - format_validity
    - reasoning_len_bucket
regularization:
  penalty: "l2"
  solver: "lbfgs"
  cv_folds: 5
  C_candidates: [0.01, 0.1, 1.0, 10.0, 100.0]
heads:
  - "P(correct)"
  - "P(known)"
fallbacks:
  pooled_threshold: 100
  escalate_threshold: 30
