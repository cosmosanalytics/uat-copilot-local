experiment: "E1_rlcr"
model:
  name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  device: "cuda"
  dtype: "bfloat16"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
training:
  algorithm: "GRPO"
  learning_rate: 1.0e-5
  group_size: 4
  num_steps: 100
  beta_kl: 0.0 # Paper Eq. 8 (No KL term)
reward:
  accuracy_weight: 0.5
  brier_weight: 0.5
  format_weight: 0.5
splits:
  train: "repo/data/sample/hotpot_train.jsonl"
  test: "repo/data/sample/hotpot_test.jsonl"
