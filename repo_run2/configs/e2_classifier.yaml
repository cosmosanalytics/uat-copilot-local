experiment: "E2_classifier"
models:
  classifier_0_5b: "Qwen/Qwen2.5-0.5B"
  classifier_1_5b: "Qwen/Qwen2.5-1.5B"
  prompted_judge: "Qwen/Qwen2.5-1.5B-Instruct"
variants:
  e2a:
    name: "Paper-faithful (Question + Solution + Answer)"
    input_format: "{question}\n{solution}\n{answer}"
    loss: "bce"
  e2b:
    name: "Context-aware (Context + Question + Solution + Answer)"
    input_format: "{context}\n{question}\n{solution}\n{answer}"
    loss: "brier"
  e2c:
    name: "Prompted Judge (Zero-shot + Logistic Recalibration)"
    system_prompt: "deepseek_verifier_prompt"
