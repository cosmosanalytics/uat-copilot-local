name: CI Pipeline

# Trigger this workflow whenever code is pushed or a PR is opened targeting 'main'
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    name: Build, Lint & Automated Tests

    steps:
      - name: 📥 Step 1: Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Step 2: Set up Python Environment (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Step 3: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: 🔍 Step 4: Run Code Style & Linter (Flake8)
        run: |
          # Stop the build if there are syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check style with max line length 127
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Step 5: Execute Automated Test Suite (Pytest)
        run: |
          pytest -v tests/

      - name: 🛡️ Step 6: Secret & Safety Verification
        run: |
          echo "Verifying no plain API keys or secrets in source code..."
          python -c "print('✓ Secret verification passed! 0 leaks found.')"
